name: Verify Personal Entry Software

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Build client and API
        run: npm run build
      - name: Smoke-test Vercel Function import
        run: VERCEL=1 node --input-type=module -e "const m = await import('./api/index.ts'); if (typeof m.default !== 'function') process.exit(1); console.log('Vercel Express entry point loads successfully');"
